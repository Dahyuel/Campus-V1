services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      POSTGRES_DB: ${POSTGRES_DB:-campus_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    # MinIO no longer publishes free images (quay.io is private, minio/minio
    # is gone from Docker Hub). Bitnami's build is the same server, frozen at
    # its last release; it starts the server itself and stores data under
    # /bitnami/minio/data. Console on :9001.
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-campus_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-campus_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-campus}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-campus}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  smart-schedule:
    build:
      context: ./backend/python/smart_schedule
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    # Inside a container "localhost" is the container itself, so the Python
    # services reach the others by their compose service names.
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:-campus}@postgres:5432/${POSTGRES_DB:-campus_db}

  whisper-service:
    build:
      context: ./backend/python/whisper_service
      dockerfile: Dockerfile
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-campus}:${POSTGRES_PASSWORD:-campus}@postgres:5432/${POSTGRES_DB:-campus_db}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      # The backend runs on the host (npm run dev), not in compose.
      - BACKEND_URL=http://host.docker.internal:${PORT:-4000}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whisper_models:/root/.cache/whisper

volumes:
  postgres_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  qdrant_data:
  whisper_models:
